<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <title>Bihar Electoral Dashboard | बिहार चुनावी डैशबोर्ड</title>
  <meta name="description" content="Comprehensive analysis of 6.56 million voter deletions across Bihar with evidence-based visualizations">
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <!-- Password protection -->
  <script>
    (function(){
      try{
        var KEY='forindia_pw_ok_v1';
        if(localStorage.getItem(KEY)!=='yes'){
          var ok=false;
          for(var i=0;i<5;i++){
            var p=window.prompt('Enter password to view the dashboard:');
            if(p===null){ break; }
            if(p==='4IndiaINC'){ ok=true; break; }
            alert('Incorrect password.');
          }
          if(!ok){
            document.documentElement.innerHTML='<!doctype html><title>Access denied</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial;padding:2rem}</style><h1>Access denied</h1><p>Reload to try again.</p>';
            throw new Error('Auth failed');
          }
          localStorage.setItem(KEY,'yes');
        }
        window.__forindiaLogout=function(){ 
          try{localStorage.removeItem(KEY);}catch(e){} 
          location.reload(); 
        };
      }catch(e){}
    })();
  </script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables for Theming */
    :root {
      /* Manmohan Singh Fellows Palette - Light Mode */
      --primary-yellow: #FFC107;
      --primary-blue: #4A90E2;
      --light-blue: #E3F2FD;
      --light-grey: #F5F5F5;
      --text-primary: #212121;
      --text-secondary: #757575;
      --white: #FFFFFF;
      --border: #E0E0E0;
      
      /* Electoral colors */
      --india-color: #4A90E2;
      --nda-color: #FF9933;
      --other-color: #808080;
      
      /* Status colors */
      --danger: #DC143C;
      --warning: #FFC107;
      --success: #4A90E2;
      
      /* Madhubani art accent colors */
      --madhubani-red: #DC143C;
      --madhubani-green: #228B22;
      --madhubani-orange: #FF8C00;
      
      /* Applied theme colors */
      --bg: var(--light-grey);
      --bg-secondary: var(--white);
      --card-bg: var(--white);
      --header-bg: var(--primary-yellow);
      --accent: var(--primary-blue);
      --shadow: 0 1px 4px rgba(0,0,0,0.08);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.12);
    }

    [data-theme="dark"] {
      --bg: #0A0E27;
      --bg-secondary: #1A1F3A;
      --card-bg: #1A1F3A;
      --header-bg: #2C3E50;
      --text-primary: #E8EAF6;
      --text-secondary: #9FA8DA;
      --border: #3F51B5;
      --light-blue: #283593;
      --accent: #5C6BC0;
      --white: #1A1F3A;
      --shadow: 0 1px 4px rgba(0,0,0,0.3);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.5);
      --india-color: #5C9CE5;
      --nda-color: #FF9933;
      --danger: #F87171;
      --warning: #FFD54F;
      --success: #5C9CE5;
    }

    /* Reset and Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Madhubani Art Background Pattern - Subtle */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0.02;
      background-image: 
        radial-gradient(circle at 20% 50%, var(--madhubani-red) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, var(--madhubani-green) 0%, transparent 50%),
        radial-gradient(circle at 50% 20%, var(--madhubani-orange) 0%, transparent 50%);
      background-size: 300px 300px;
      pointer-events: none;
      z-index: 0;
    }

    /* Container - Optimized for better space */
    .container {
      max-width: 1480px;
      margin: 0 auto;
      padding: 0.75rem;
      position: relative;
      z-index: 1;
      flex: 1;
    }

    /* Header - Compact */
    header {
      background: linear-gradient(135deg, var(--header-bg) 0%, var(--accent) 100%);
      color: var(--text-primary);
      padding: 1rem 1.25rem;
      border-radius: 0.75rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    /* Madhubani border decoration */
    header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: repeating-linear-gradient(
        90deg,
        var(--madhubani-red) 0px,
        var(--madhubani-red) 10px,
        var(--madhubani-green) 10px,
        var(--madhubani-green) 20px,
        var(--madhubani-orange) 20px,
        var(--madhubani-orange) 30px
      );
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .brand {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    /* Language Switcher */
    .lang-switcher {
      display: flex;
      gap: 0.25rem;
      margin-left: auto;
      margin-right: 1rem;
    }

    .lang-btn {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: var(--accent);
      color: white;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-primary);
      border-radius: 0.5rem;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--accent);
      color: var(--white);
      transform: translateY(-1px);
      box-shadow: var(--shadow-hover);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--white);
      border-color: var(--accent);
    }

    .btn-export {
      background: var(--success);
      color: white;
      border-color: var(--success);
      font-size: 0.7rem;
      padding: 0.2rem 0.4rem;
    }

    .btn-report {
      background: linear-gradient(135deg, var(--primary-yellow) 0%, var(--warning) 100%);
      color: var(--text-primary);
      border: 2px solid var(--primary-yellow);
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      margin-top: 1rem;
    }

    /* Tabs - Compact */
    .tabs-container {
      background: var(--card-bg);
      border-radius: 0.75rem;
      padding: 0.2rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tabs {
      display: flex;
      gap: 0.2rem;
      min-width: max-content;
    }

    .tab {
      background: transparent;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all 0.2s ease;
      font-size: 0.8rem;
      white-space: nowrap;
      position: relative;
    }

    .tab:hover {
      color: var(--text-primary);
      background: var(--light-blue);
    }

    .tab.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 2px 6px rgba(74, 144, 226, 0.3);
    }

    /* Tab translations */
    .tab-text {
      display: block;
    }

    .tab-text-hindi {
      display: none;
      font-family: 'Noto Sans Devanagari', sans-serif;
    }

    .tab-text-bengali {
      display: none;
      font-family: 'Noto Sans Bengali', sans-serif;
    }

    .tab-text-tamil {
      display: none;
      font-family: 'Noto Sans Tamil', sans-serif;
    }

    [data-lang="hi"] .tab-text { display: none; }
    [data-lang="hi"] .tab-text-hindi { display: block; }
    [data-lang="bn"] .tab-text { display: none; }
    [data-lang="bn"] .tab-text-bengali { display: block; }
    [data-lang="ta"] .tab-text { display: none; }
    [data-lang="ta"] .tab-text-tamil { display: block; }

    /* Main Content */
    main {
      min-height: 50vh;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Grid Layouts - Optimized */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .grid-2col {
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr));
    }

    .grid-full {
      grid-template-columns: 1fr;
    }

    /* Cards - Compact */
    .card {
      background: var(--card-bg);
      border-radius: 0.75rem;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: all 0.2s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .card-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--light-blue) 0%, transparent 100%);
    }

    .card-header h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .card-tools {
      display: flex;
      gap: 0.3rem;
    }

    .card-body {
      padding: 1rem;
    }

    /* Visualizations */
    .viz {
      min-height: 280px;
      max-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0.5rem;
    }

    canvas {
      max-width: 100% !important;
      height: auto !important;
      max-height: 380px !important;
    }

    /* Statistics Grid - Compact */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .stat-card {
      background: linear-gradient(135deg, var(--light-blue) 0%, var(--card-bg) 100%);
      padding: 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      height: 3px;
      background: linear-gradient(90deg, var(--madhubani-red), var(--madhubani-green), var(--madhubani-orange));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .stat-card:hover::before {
      opacity: 1;
    }

    .stat-card:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-hover);
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    .stat-value {
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.1;
    }

    .stat-change {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .stat-change.positive {
      color: var(--success);
    }

    .stat-change.negative {
      color: var(--danger);
    }

    /* Tables - Compact */
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: -0.5rem;
      padding: 0.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    th, td {
      padding: 0.5rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: var(--light-blue);
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
      font-size: 0.75rem;
    }

    tbody tr:hover {
      background: var(--light-grey);
    }

    td.negative {
      color: var(--danger);
      font-weight: 600;
    }

    /* Critical Findings */
    .critical-section {
      background: linear-gradient(135deg, var(--danger) 0%, var(--warning) 100%);
      color: white;
      padding: 1rem;
      border-radius: 0.75rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-hover);
    }

    .critical-section h3 {
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Takeaways - Compact */
    .takeaway {
      margin-top: 0.75rem;
      padding: 0.75rem;
      border-radius: 0.5rem;
      border-left: 3px solid;
      background: var(--card-bg);
      font-size: 0.85rem;
    }

    .takeaway-critical {
      border-color: var(--danger);
      background: linear-gradient(90deg, rgba(244,67,54,0.08) 0%, transparent 100%);
    }

    .takeaway-warning {
      border-color: var(--warning);
      background: linear-gradient(90deg, rgba(255,152,0,0.08) 0%, transparent 100%);
    }

    .takeaway-info {
      border-color: var(--accent);
      background: linear-gradient(90deg, rgba(74,144,226,0.08) 0%, transparent 100%);
    }

    .takeaway-success {
      border-color: var(--success);
      background: linear-gradient(90deg, rgba(76,175,80,0.08) 0%, transparent 100%);
    }

    /* Key Insight Box */
    .key-insight {
      background: linear-gradient(135deg, var(--primary-yellow) 0%, var(--accent) 100%);
      color: var(--text-primary);
      padding: 1.25rem;
      border-radius: 0.75rem;
      margin: 1rem 0;
      box-shadow: var(--shadow-hover);
    }

    .key-insight h3 {
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Technical Terms Explanation Box */
    .tech-explain {
      background: var(--light-blue);
      border: 1px solid var(--accent);
      border-radius: 0.5rem;
      padding: 0.75rem;
      margin: 0.75rem 0;
      font-size: 0.85rem;
    }

    .tech-explain h4 {
      color: var(--accent);
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }

    /* Score Badges */
    .score-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .score-critical {
      background: var(--danger);
      color: white;
    }

    .score-high {
      background: var(--warning);
      color: white;
    }

    .score-medium {
      background: var(--primary-yellow);
      color: var(--text-primary);
    }

    .score-low {
      background: var(--success);
      color: white;
    }

    /* Benchmark Box */
    .benchmark-box {
      background: var(--light-blue);
      border: 1px solid var(--primary-blue);
      border-radius: 0.5rem;
      padding: 0.75rem;
      margin: 0.75rem 0;
      font-size: 0.85rem;
    }

    .benchmark-box h4 {
      color: var(--accent);
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Loading State */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      color: var(--text-secondary);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer - Compact */
    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      margin-top: 2rem;
      padding: 1rem;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.75rem;
      line-height: 1.5;
      width: 100%;
    }

    /* Responsive Design - Mobile First */
    @media (max-width: 768px) {
      .container {
        padding: 0.5rem;
      }

      header {
        padding: 0.75rem;
        border-radius: 0.5rem;
      }

      .header-content {
        flex-direction: column;
        text-align: center;
      }

      .brand {
        font-size: 1.25rem;
      }

      .lang-switcher {
        margin: 0.5rem 0;
      }

      .controls {
        width: 100%;
        justify-content: center;
      }

      .tabs-container {
        margin: 0 -0.5rem 1rem;
        border-radius: 0;
      }

      .tab {
        padding: 0.4rem 0.8rem;
        font-size: 0.75rem;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }

      .stat-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }

      .card-header {
        padding: 0.6rem;
      }

      .card-body {
        padding: 0.75rem;
      }

      .viz {
        min-height: 240px;
        max-height: 320px;
      }

      table {
        font-size: 0.7rem;
      }

      th, td {
        padding: 0.4rem;
      }

      footer {
        padding: 0.75rem;
        font-size: 0.7rem;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1025px) {
      .grid-3col {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Print Styles */
    @media print {
      body {
        background: white;
        color: black;
      }

      header {
        background: none;
        color: black;
        border: 1px solid black;
      }

      .controls, .tabs-container, .lang-switcher {
        display: none;
      }

      .card {
        page-break-inside: avoid;
        border: 1px solid black;
        box-shadow: none;
      }
    }

    /* Accessibility */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Focus Styles */
    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
      border-radius: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 8px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-blue);
    }
  </style>

  <!-- Chart.js and Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body data-lang="en">
  <div class="container">
    <header>
      <div class="header-content">
        <div class="brand">
          <div class="brand-icon">🗳️</div>
          <span class="brand-text">Bihar Electoral Dashboard</span>
        </div>
        
        <div class="lang-switcher">

    function exportToCSV(data, filename) {
      const csv = Papa.unparse(data);
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function exportToPNG(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      if (canvas) {
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL();
        link.click();
      }
    }
