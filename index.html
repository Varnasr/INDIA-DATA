      ['How does the Muslim share of removals compare with the population?', pct(lo) + ' to ' + pct(hi) + ' of removals against 16.87% in 2011; above the census share by more than a point in ' + above.length + ' districts.'],
      ['Do border constituencies differ?', 'Border seats lost ' + d(rate(bd), 2) + ' per 100 electors, the interior ' + d(rate(inn), 2) + '.'],
      ['How did NDA and INDIA seats compare?', 'NDA-held seats lost ' + d(L['2020'].NDA.per_100, 2) + ' per 100 electors and INDIA seats ' + d(L['2020'].INDIA.per_100, 2) + ' (2020 winners). A seat\'s winner does not say how its removed electors voted; the margin comparison above is the one the lists can support.'],
      ['What would settle whose votes these were?', 'A name-by-name verification of removals in the seats where they exceed the margin, and booth-by-booth publication of every claim and objection filed after the draft roll and its outcome.']
    ];
    html += section('research', RQ.map(function (q) { return '<div class="research-section"><div class="research-q">' + q[0] + '</div><div class="research-a">' + q[1] + '</div></div>'; }).join('') + '<p><a href="bihar/faq/">More questions and answers</a> · <a href="bihar/method/">Full method</a></p>');

    // ============================================================ METHODS
    html += section('methodology',
      '<div class="methodology"><h2>Data sources</h2><ul><li>Removals by polling booth: the phase 1 deletion lists the Chief Electoral Officer, Bihar published against the draft roll of 1 August 2025, for all 77,837 booths.</li><li>Removals by constituency, phase and sex: Chief Electoral Officer, Bihar.</li><li>Religion and surnames of the removed: counts from the same lists, by booth; no individual records.</li><li>2024 Lok Sabha result by booth: Form 20. 2020 and 2025 Assembly results: Election Commission of India.</li><li>Census of India 2011; Bihar caste-based survey, 2 October 2023; Bihar Economic Survey.</li></ul></div>' +
      '<div class="methodology"><h2>How the figures are built</h2><p>Each booth is counted once. Party names in the booth results are matched to the declared seat results, which the booth sums reproduce in all 40 Lok Sabha seats. Religion and caste are read from names and are estimates: religion as a range, caste under two classifications, with only what holds under both reported. Every headline figure is recomputed from the lists by a second, independent program before publication.</p></div>' +
      '<div class="methodology"><h2>What this shows and what it does not</h2><p>The lists show how many names were removed, where, and who the removed were by sex and by name, and they allow the removals to be set against the margins that decided each seat. They do not show why an individual name was removed, whether the removal was right, or how the elector voted. A name-by-name verification, starting with the seats where removals exceed the margin, would settle those questions.</p><p><a href="bihar/method/">Full method</a></p></div>');

    main.innerHTML = html;

    // ------------------------------------------------------------------ table
    var rows = A.map(function (a) { return Object.assign({}, a, { fem: 100 * a.t_f / (a.t_f + a.t_m), xm: a.margin2025 ? a.total / a.margin2025 : null }); });
    var cols = [['name', 'Constituency', 1], ['district', 'District', 1], ['total', 'Removed'], ['per_100', 'Per 100'], ['fem', 'Women %'], ['win2025', '2025 winner', 1], ['margin2025', '2025 margin'], ['xm', 'Removed ÷ margin']];
    var key = 'xm', dir = -1, q = '';
    function renderTable() {
      var list = rows.filter(function (a) { return !q || (a.name + ' ' + a.district).toLowerCase().indexOf(q) >= 0; }).sort(function (a, b) { var x = a[key], y = b[key]; if (typeof x === 'string') return dir * x.localeCompare(y); return dir * ((x == null ? -1e9 : x) - (y == null ? -1e9 : y)); });
      document.getElementById('seatTable').innerHTML = '<thead><tr>' + cols.map(function (c) { return '<th scope="col" class="' + (c[2] ? 'l' : '') + '" aria-sort="' + (c[0] === key ? (dir < 0 ? 'descending' : 'ascending') : 'none') + '"><button type="button" data-k="' + c[0] + '">' + c[1] + '</button></th>'; }).join('') + '</tr></thead><tbody>' +
        list.map(function (a) { return '<tr><td class="l"><a href="bihar/#ac' + ('00' + a.ac).slice(-3) + '">' + a.ac + ' ' + esc(a.name) + '</a></td><td class="l">' + esc(a.district) + '</td><td>' + n(a.total) + '</td><td>' + d(a.per_100, 2) + '</td><td>' + d(a.fem, 1) + '</td><td class="l">' + esc(a.win2025) + ' ' + tag(a.al2025) + '</td><td>' + n(a.margin2025) + '</td><td>' + d(a.xm, 1) + '</td></tr>'; }).join('') + '</tbody>';
    }
    document.getElementById('seatTable').addEventListener('click', function (e) { var b = e.target.closest('th button'); if (!b) return; var k = b.getAttribute('data-k'); dir = k === key ? -dir : -1; key = k; renderTable(); });
    document.getElementById('seatq').addEventListener('input', function () { q = this.value.trim().toLowerCase(); renderTable(); });
    renderTable();

    // ------------------------------------------------------------------ tabs
    var tabs = document.querySelectorAll('.nav-tab'), drawn = {};
    function show(tab, push) {
      tabs.forEach(function (b) { var on = b.getAttribute('data-tab') === tab; b.setAttribute('aria-selected', on ? 'true' : 'false'); b.id = 'tabbtn-' + b.getAttribute('data-tab'); b.tabIndex = on ? 0 : -1; });
      document.querySelectorAll('.tab-content').forEach(function (s) { s.classList.toggle('active', s.id === 'tab-' + tab); });
      if (!drawn[tab]) { drawTab(tab); drawn[tab] = true; }
      if (push) history.replaceState(null, '', '#' + tab);
    }
    tabs.forEach(function (b, i) {
      b.addEventListener('click', function () { show(b.getAttribute('data-tab'), true); });
      b.addEventListener('keydown', function (e) { var j = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : null; if (j == null) return; var nb = tabs[(j + tabs.length) % tabs.length]; nb.focus(); nb.click(); });
    });
    var start = (location.hash || '#overview').slice(1); show(document.getElementById('tab-' + start) ? start : 'overview');

    // ------------------------------------------------------------------ actions
    themeBtn.addEventListener('click', function () {
      if (isDark()) root.removeAttribute('data-theme'); else root.setAttribute('data-theme', 'dark');
      try { localStorage.setItem('sir-dash-theme', isDark() ? 'dark' : 'light'); } catch (e) {}
      setThemeLabel(); Object.keys(charts).forEach(draw);
    });
    main.addEventListener('click', function (e) {
      var b = e.target.closest('[data-png]'); if (!b || !charts[b.getAttribute('data-png')]) return;
      var a = document.createElement('a'); a.href = charts[b.getAttribute('data-png')].toBase64Image('image/png', 1); a.download = 'bihar-sir-' + b.getAttribute('data-png') + '.png'; a.click();
    });
    document.getElementById('pdfBtn').addEventListener('click', function () { Object.keys(specs).forEach(function (id) { if (!charts[id]) draw(id); }); document.querySelectorAll('.tab-content').forEach(function (s) { s.classList.add('active'); }); setTimeout(function () { window.print(); document.querySelectorAll('.tab-content').forEach(function (s) { s.classList.toggle('active', s.id === 'tab-' + (location.hash.slice(1) || 'overview')); }); }, 400); });
    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { Object.keys(charts).forEach(draw); }, 250); });
  }).catch(function (e) { main.innerHTML = '<p role="alert">The dashboard data did not load (' + esc(e.message) + '). Please reload the page.</p>'; });
})();
