          }
          localStorage.setItem(KEY,'yes');
        }
        window.__forindiaLogout=function(){ 
          try{localStorage.removeItem(KEY);}catch(e){} 
          location.reload(); 
        };
      }catch(e){}
    })();

  <style>
    /* CSS Variables for Theming */
    :root {
      /* Manmohan Singh Fellows Palette - Light Mode */
      --primary-yellow: #FFC107;
      --primary-blue: #4A90E2;
      --light-blue: #E3F2FD;
      --light-grey: #F5F5F5;
      --text-primary: #212121;
      --text-secondary: #757575;
      --white: #FFFFFF;
      --border: #E0E0E0;
      
      /* Electoral colors */
      --india-color: #4A90E2;
      --nda-color: #FF9933;
      --other-color: #808080;
      
      /* Status colors */
      --danger: #DC143C;
      --warning: #FFC107;
      --success: #4A90E2;
      
      /* Madhubani art accent colors */
      --madhubani-red: #DC143C;
      --madhubani-green: #228B22;
      --madhubani-orange: #FF8C00;
      
      /* Applied theme colors */
      --bg: var(--light-grey);
      --bg-secondary: var(--white);
      --card-bg: var(--white);
      --header-bg: var(--primary-yellow);
      --accent: var(--primary-blue);
      --shadow: 0 1px 4px rgba(0,0,0,0.08);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.12);
    }

    [data-theme="dark"] {
      --bg: #0A0E27;
      --bg-secondary: #1A1F3A;
      --card-bg: #1A1F3A;
      --header-bg: #2C3E50;
      --text-primary: #E8EAF6;
      --text-secondary: #9FA8DA;
      --border: #3F51B5;
      --light-blue: #283593;
      --accent: #5C6BC0;
      --white: #1A1F3A;
      --shadow: 0 1px 4px rgba(0,0,0,0.3);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.5);
      --india-color: #5C9CE5;
      --nda-color: #FF9933;
      --danger: #F87171;
      --warning: #FFD54F;
      --success: #5C9CE5;
    }

    /* Reset and Base Styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Noto Sans Devanagari', 'Mukta', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Madhubani Art Background Pattern - Subtle */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.02;
      background-image: 
        radial-gradient(circle at 20% 50%, var(--madhubani-red) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, var(--madhubani-green) 0%, transparent 50%),
        radial-gradient(circle at 50% 20%, var(--madhubani-orange) 0%, transparent 50%);
      background-size: 300px 300px;
      pointer-events: none;
      z-index: 0;
    }

    .container { max-width: 1480px; margin: 0 auto; padding: 0.75rem; position: relative; z-index: 1; flex: 1; }

    header {
      background: linear-gradient(135deg, var(--header-bg) 0%, var(--accent) 100%);
      color: var(--text-primary);
      padding: 1rem 1.25rem; border-radius: 0.75rem; margin-bottom: 1rem; box-shadow: var(--shadow); position: relative; overflow: hidden;
    }

    header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: repeating-linear-gradient(90deg, var(--madhubani-red) 0px, var(--madhubani-red) 10px, var(--madhubani-green) 10px, var(--madhubani-green) 20px, var(--madhubani-orange) 20px, var(--madhubani-orange) 30px); }

    .header-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; }
    .brand { font-size: clamp(1.25rem, 3vw, 1.75rem); font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.5rem; }
    .brand-icon { width: 36px; height: 36px; background: var(--white); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }

    .lang-switcher { display: flex; gap: 0.25rem; margin-left: auto; margin-right: 1rem; }
    .lang-btn { padding: 0.25rem 0.5rem; font-size: 0.75rem; background: var(--card-bg); border: 1px solid var(--border); border-radius: 0.25rem; cursor: pointer; transition: all 0.2s; }
    .lang-btn.active { background: var(--accent); color: white; }

    .controls { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .btn { appearance: none; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-primary); border-radius: 0.5rem; padding: 0.4rem 0.8rem; cursor: pointer; font-weight: 600; transition: all 0.2s ease; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
    .btn:hover { background: var(--accent); color: var(--white); transform: translateY(-1px); box-shadow: var(--shadow-hover); }
    .btn-primary { background: var(--accent); color: var(--white); border-color: var(--accent); }
    .btn-export { background: var(--success); color: white; border-color: var(--success); font-size: 0.7rem; padding: 0.2rem 0.4rem; }
    .btn-report { background: linear-gradient(135deg, var(--primary-yellow) 0%, var(--warning) 100%); color: var(--text-primary); border: 2px solid var(--primary-yellow); padding: 0.75rem 1.5rem; font-size: 1rem; margin-top: 1rem; }

    .tabs-container { background: var(--card-bg); border-radius: 0.75rem; padding: 0.2rem; margin-bottom: 1rem; box-shadow: var(--shadow); overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tabs { display: flex; gap: 0.2rem; min-width: max-content; }
    .tab { background: transparent; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; color: var(--text-secondary); transition: all 0.2s ease; font-size: 0.8rem; white-space: nowrap; position: relative; }
    .tab:hover { color: var(--text-primary); background: var(--light-blue); }
    .tab.active { background: var(--accent); color: white; box-shadow: 0 2px 6px rgba(74, 144, 226, 0.3); }

    .tab-text { display: block; }
    .tab-text-hindi, .tab-text-bengali, .tab-text-tamil, .tab-text-marathi { display: none; }
    [data-lang="hi"] .tab-text { display: none; } [data-lang="hi"] .tab-text-hindi { display: block; }
    [data-lang="bn"] .tab-text { display: none; } [data-lang="bn"] .tab-text-bengali { display: block; }
    [data-lang="ta"] .tab-text { display: none; } [data-lang="ta"] .tab-text-tamil { display: block; }
    [data-lang="mr"] .tab-text { display: none; } [data-lang="mr"] .tab-text-marathi { display: block; }

    main { min-height: 50vh; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .grid-2col { grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); }
    .grid-3col { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
    .grid-full { grid-template-columns: 1fr; }

    .card { background: var(--card-bg); border-radius: 0.75rem; box-shadow: var(--shadow); overflow: hidden; transition: all 0.2s ease; position: relative; }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
    .card-header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; background: linear-gradient(135deg, var(--light-blue) 0%, transparent 100%); }
    .card-header h3 { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 0.4rem; }
    .card-tools { display: flex; gap: 0.3rem; }
    .card-body { padding: 1rem; }

    .viz { min-height: 280px; max-height: 400px; display: flex; align-items: center; justify-content: center; position: relative; padding: 0.5rem; }
    canvas { max-width: 100% !important; height: auto !important; max-height: 380px !important; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
    .stat-card { background: linear-gradient(135deg, var(--light-blue) 0%, var(--card-bg) 100%); padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border); transition: all 0.2s ease; text-align: center; position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: -2px; left: -2px; right: -2px; height: 3px; background: linear-gradient(90deg, var(--madhubani-red), var(--madhubani-green), var(--madhubani-orange)); opacity: 0; transition: opacity 0.2s; }
    .stat-card:hover::before { opacity: 1; }
    .stat-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
    .stat-label { font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
    .stat-value { font-size: clamp(1.25rem, 2.5vw, 1.75rem); font-weight: 800; color: var(--text-primary); line-height: 1.1; }
    .stat-change { font-size: 0.7rem; color: var(--text-secondary); margin-top: 0.25rem; }
    .stat-change.positive { color: var(--success); }
    .stat-change.negative { color: var(--danger); }

    .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: -0.5rem; padding: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--light-blue); font-weight: 600; position: sticky; top: 0; z-index: 10; font-size: 0.75rem; }
    tbody tr:hover { background: var(--light-grey); }
    td.negative { color: var(--danger); font-weight: 600; }

    .critical-section { background: linear-gradient(135deg, var(--danger) 0%, var(--warning) 100%); color: white; padding: 1rem; border-radius: 0.75rem; margin-bottom: 1rem; box-shadow: var(--shadow-hover); }
    .critical-section h3 { font-size: 1.1rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }

    .takeaway { margin-top: 0.75rem; padding: 0.75rem; border-radius: 0.5rem; border-left: 3px solid; background: var(--card-bg); font-size: 0.85rem; }
    .takeaway-critical { border-color: var(--danger); background: linear-gradient(90deg, rgba(244,67,54,0.08) 0%, transparent 100%); }
    .takeaway-warning { border-color: var(--warning); background: linear-gradient(90deg, rgba(255,152,0,0.08) 0%, transparent 100%); }
    .takeaway-info { border-color: var(--accent); background: linear-gradient(90deg, rgba(74,144,226,0.08) 0%, transparent 100%); }
    .takeaway-success { border-color: var(--success); background: linear-gradient(90deg, rgba(76,175,80,0.08) 0%, transparent 100%); }

    .key-insight { background: linear-gradient(135deg, var(--primary-yellow) 0%, var(--accent) 100%); color: var(--text-primary); padding: 1.25rem; border-radius: 0.75rem; margin: 1rem 0; box-shadow: var(--shadow-hover); }
    .key-insight h3 { font-size: 1.1rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }

    .tech-explain { background: var(--light-blue); border: 1px solid var(--accent); border-radius: 0.5rem; padding: 0.75rem; margin: 0.75rem 0; font-size: 0.85rem; }
    .tech-explain h4 { color: var(--accent); margin-bottom: 0.4rem; font-size: 0.9rem; }

    .score-badge { display: inline-flex; align-items: center; padding: 0.2rem 0.6rem; border-radius: 999px; font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .score-critical { background: var(--danger); color: white; }
    .score-high { background: var(--warning); color: white; }
    .score-medium { background: var(--primary-yellow); color: var(--text-primary); }
    .score-low { background: var(--success); color: white; }

    .benchmark-box { background: var(--light-blue); border: 1px solid var(--primary-blue); border-radius: 0.5rem; padding: 0.75rem; margin: 0.75rem 0; font-size: 0.85rem; }
    .benchmark-box h4 { color: var(--accent); margin-bottom: 0.4rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em; }

    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; color: var(--text-secondary); }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { background: var(--card-bg); border-top: 1px solid var(--border); margin-top: 2rem; padding: 1rem; text-align: center; color: var(--text-secondary); font-size: 0.75rem; line-height: 1.5; width: 100%; }

    @media (max-width: 768px) {
      .container { padding: 0.5rem; }
      header { padding: 0.75rem; border-radius: 0.5rem; }
      .header-content { flex-direction: column; text-align: center; }
      .brand { font-size: 1.25rem; }
      .lang-switcher { margin: 0.5rem 0; }
      .controls { width: 100%; justify-content: center; }
      .tabs-container { margin: 0 -0.5rem 1rem; border-radius: 0; }
      .tab { padding: 0.4rem 0.8rem; font-size: 0.75rem; }
      .grid { grid-template-columns: 1fr; gap: 0.75rem; }
    }
  </style>

</head>

      },
      
      religionComposition: {
        hindu: { percent: 74.4, deletions: 4880757 },
        muslim: { percent: 15.2, deletions: 997063 },
        unknown: { percent: 8.9, deletions: 583806 },
        other: { percent: 1.5, deletions: 98394 }
      },
      
      topConstituencies: [
        { name: 'Pipra', deletions: 169161 },
        { name: 'Valmikinagar', deletions: 132166 },
        { name: 'Nalanda', deletions: 115873 },
        { name: 'Vaishali', deletions: 114613 },
        { name: 'Siwan', deletions: 113272 }
      ]
    };

    let charts = {};

    function clearCharts(){ Object.values(charts).forEach(c=>c && c.destroy()); charts={}; }

    function exportToCSV(data, filename){ const csv=Papa.unparse(data); const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}); const link=document.createElement('a'); const url=URL.createObjectURL(blob); link.setAttribute('href',url); link.setAttribute('download',filename); link.style.visibility='hidden'; document.body.appendChild(link); link.click(); document.body.removeChild(link); }
    function exportToPNG(canvasId, filename){ const canvas=document.getElementById(canvasId); if(canvas){ const link=document.createElement('a'); link.download=filename; link.href=canvas.toDataURL(); link.click(); } }
    function createExportButtons(data, canvasId){ return `<div class="card-tools"><button class="btn btn-export" onclick="exportToCSV(${JSON.stringify([])}, 'data.csv')"><span>📊</span><span>Export CSV</span></button>${canvasId?`<button class="btn btn-export" onclick="exportToPNG('${canvasId}','chart.png')"><span>🖼️</span><span>Export PNG</span></button>`:''}</div>`; }

    function renderOverview(){
      const main=document.getElementById('main');
      main.innerHTML = `
        <div class="critical-section">
          <h3><span>⚠️</span><span>CRITICAL FINDING: Electoral Outcome Correlation</span></h3>
          <p>As voter deletions increase from 0-49 to 650-700 per booth:</p>
          <ul style="margin: 1rem 0; padding-left: 1.5rem;">
            <li>INDIA Alliance win rate drops from 39.9% to below 30%</li>
            <li>NDA win rate increases from 47.7% to over 59%</li>
            <li>Pattern consistent across all 77,837 booths analyzed</li>
            <li>From 2020 to 2024: INDIA lost 18 seats while deletions increased by 11%</li>
          </ul>
        </div>
        <div class="stat-grid">
          <div class="stat-card"><div class="stat-label">Total Deletions</div><div class="stat-value">6.56M</div><div class="stat-change negative">8.4% of electorate</div></div>
          <div class="stat-card"><div class="stat-label">Total Booths</div><div class="stat-value">77,837</div><div class="stat-change">Across 243 ACs</div></div>
          <div class="stat-card"><div class="stat-label">2020→2024 Impact</div><div class="stat-value">-18</div><div class="stat-change negative">INDIA seats lost</div></div>
          <div class="stat-card"><div class="stat-label">INDIA Win Rate</div><div class="stat-value">38.7%</div><div class="stat-change negative">vs NDA 49.9%</div></div>
          <div class="stat-card"><div class="stat-label">Female Deletions</div><div class="stat-value">71.6%</div><div class="stat-change negative">vs 49% population</div></div>
          <div class="stat-card"><div class="stat-label">Caste-neutral Surnames</div><div class="stat-value">48.1%</div><div class="stat-change negative">of deletions</div></div>
        </div>
        <div class="grid">
          <div class="card">
            <div class="card-header"><h3>Alliance Performance by Deletion Intensity</h3>${createExportButtons(DATA.deletionBins,'chart-alliance')}</div>
            <div class="card-body"><div class="viz"><canvas id="chart-alliance"></canvas></div><div class="takeaway takeaway-critical"><p><strong>What This Means:</strong></p><p>The correlation is -0.52 for INDIA and +0.48 for NDA. This means deletions systematically favor NDA outcomes.</p></div></div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Caste-wise Deletion Impact</h3>${createExportButtons(DATA.casteAnalysis,'chart-caste')}</div>
            <div class="card-body"><div class="viz"><canvas id="chart-caste"></canvas></div><div class="takeaway takeaway-warning"><p><strong>Key Finding:</strong></p><p>EBC (36%) and OBC (27.1%) together account for 63.1% of deletions. 48.1% have protective surnames adopted to escape caste discrimination.</p></div></div>
          </div>
          <div class="card"><div class="card-header"><h3>Deletion Size Distribution</h3>${createExportButtons([], 'chart-deletion-dist')}</div><div class="card-body"><div class="viz"><canvas id="chart-deletion-dist"></canvas></div></div></div>
          <div class="card"><div class="card-header"><h3>Top 10 ACs by Deletion Count</h3>${createExportButtons([], 'chart-top-acs')}</div><div class="card-body"><div class="viz"><canvas id="chart-top-acs"></canvas></div></div></div>
        </div>`;

      setTimeout(()=>{
        const cs=getComputedStyle(document.documentElement);
        const ctx1=document.getElementById('chart-alliance').getContext('2d');
        charts['alliance']=new Chart(ctx1,{ type:'line', data:{ labels: DATA.deletionBins.map(b=>b.range), datasets:[{label:'INDIA Alliance Win %', data: DATA.deletionBins.map(b=>b.indiaRate), borderColor: cs.getPropertyValue('--india-color'), backgroundColor: cs.getPropertyValue('--india-color')+'33', borderWidth:3, tension:0.3},{label:'NDA Win %', data: DATA.deletionBins.map(b=>b.ndaRate), borderColor: cs.getPropertyValue('--nda-color'), backgroundColor: cs.getPropertyValue('--nda-color')+'33', borderWidth:3, tension:0.3}]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:'top'} }, scales:{ y:{ beginAtZero:true, max:70, title:{ display:true, text:'Win Percentage (%)'} } } }});

        const ctx2=document.getElementById('chart-caste').getContext('2d');
        charts['caste']=new Chart(ctx2,{ type:'bar', data:{ labels: DATA.casteAnalysis.map(c=>c.caste), datasets:[{ label:'Deletions by Caste', data: DATA.casteAnalysis.map(c=>c.deletions), backgroundColor:[ cs.getPropertyValue('--warning'), cs.getPropertyValue('--primary-yellow'), cs.getPropertyValue('--primary-blue'), cs.getPropertyValue('--accent'), cs.getPropertyValue('--success'), cs.getPropertyValue('--danger') ]}]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} }, scales:{ y:{ beginAtZero:true, title:{ display:true, text:'Number of Deletions'} } } }});

        const ctx3=document.getElementById('chart-deletion-dist').getContext('2d');
        charts['deletionDist']=new Chart(ctx3,{ type:'bar', data:{ labels:['0-50','50-100','100-150','150-200','200-250','250-300','300+'], datasets:[{ label:'Booth Count', data:[23780,29872,15055,5712,2093,752,573], backgroundColor: cs.getPropertyValue('--primary-blue'), borderColor: cs.getPropertyValue('--accent'), borderWidth:1 }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} }, scales:{ y:{ beginAtZero:true } } }});

        const ctx4=document.getElementById('chart-top-acs').getContext('2d');
        charts['topACs']=new Chart(ctx4,{ type:'bar', data:{ labels: DATA.topConstituencies.map(c=>c.name), datasets:[{ label:'Deletions', data: DATA.topConstituencies.map(c=>c.deletions), backgroundColor: cs.getPropertyValue('--warning'), borderColor: cs.getPropertyValue('--primary-yellow'), borderWidth:1 }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true } } }});
      },100);
    }

    function renderDemographic(){
      const main=document.getElementById('main');
      main.innerHTML=`<h2 style="padding: 1.5rem 0;">Demographic Benchmarking Analysis</h2>
        <div class="benchmark-box"><h4>Data Sources for Benchmarking</h4><ul style="margin:0.5rem 0; padding-left:1.5rem;"><li><strong>Population Data:</strong> Bihar Caste Survey 2022 (13.07 crore population)</li><li><strong>Gender Ratio:</strong> NFHS-5 (2019-21) - 49% Female, 51% Male</li><li><strong>Caste Distribution:</strong> Bihar Caste Survey 2022</li><li><strong>NOT Using:</strong> Census 2011 (14+ years old, outdated)</li></ul></div>
        <div class="grid">
          <div class="card"><div class="card-header"><h3>Gender: Deletions vs Population</h3>${createExportButtons([], 'chart-gender-benchmark')}</div><div class="card-body"><div class="viz"><canvas id="chart-gender-benchmark"></canvas></div><div class="takeaway takeaway-critical"><p><strong>Critical Finding:</strong> Women are 71.6% of deletions but only 49% of population</p><p>This is 46.1% over-representation. Expected: 3.2M female deletions, Actual: 4.7M</p></div></div></div>
          <div class="card"><div class="card-header"><h3>Caste: Deletions vs Population Distribution</h3>${createExportButtons([], 'chart-caste-benchmark')}</div><div class="card-body"><div class="viz"><canvas id="chart-caste-benchmark"></canvas></div><div class="takeaway takeaway-warning"><p><strong>Key Pattern:</strong> Traditional castes show proportional deletions</p><p>BUT 48.1% of deletions have protective surnames (anti-caste movement)</p></div></div></div>
        </div>
        <div class="card"><div class="card-header"><h3>Detailed Demographic Comparison Table</h3></div><div class="card-body"><table><thead><tr><th>Category</th><th>Population % (2022)</th><th>Deletion %</th><th>Expected Deletions</th><th>Actual Deletions</th><th>Difference</th></tr></thead><tbody>
          <tr><td><strong>Female</strong></td><td>49%</td><td class="negative">71.6%</td><td>3,213,216</td><td>4,697,088</td><td class="negative">+1,483,872</td></tr>
          <tr><td><strong>Male</strong></td><td>51%</td><td>28.4%</td><td>3,346,409</td><td>1,862,538</td><td>-1,483,871</td></tr>
          <tr><td colspan="6" style="background: var(--light-blue); font-weight: bold;">Caste Categories</td></tr>
          <tr><td><strong>EBC</strong></td><td>36.01%</td><td>36.0%</td><td>2,362,133</td><td>2,362,467</td><td>+334</td></tr>
          <tr><td><strong>OBC</strong></td><td>27.12%</td><td>27.1%</td><td>1,777,921</td><td>1,779,210</td><td>+1,289</td></tr>
          <tr><td><strong>SC</strong></td><td>19.65%</td><td>19.6%</td><td>1,288,785</td><td>1,288,393</td><td>-392</td></tr>
          <tr><td><strong>Forward</strong></td><td>15.52%</td><td>15.5%</td><td>1,018,659</td><td>1,017,741</td><td>-918</td></tr>
          <tr><td><strong>ST</strong></td><td>1.70%</td><td>1.7%</td><td>111,396</td><td>111,613</td><td>+217</td></tr>
        </tbody></table></div></div>`;

      setTimeout(()=>{
        const cs=getComputedStyle(document.documentElement);
        const ctx1=document.getElementById('chart-gender-benchmark').getContext('2d');
        charts['genderBench']=new Chart(ctx1,{ type:'bar', data:{ labels:['Female','Male'], datasets:[{ label:'Deletion %', data:[71.6,28.4], backgroundColor:[ cs.getPropertyValue('--danger'), cs.getPropertyValue('--success') ]},{ label:'Population %', data:[49,51], backgroundColor:[ cs.getPropertyValue('--primary-yellow'), cs.getPropertyValue('--primary-blue') ]}]}, options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true, max:100 } } }});

        const ctx2=document.getElementById('chart-caste-benchmark').getContext('2d');
        charts['casteBench']=new Chart(ctx2,{ type:'bar', data:{ labels:['EBC','OBC','SC','Forward','ST'], datasets:[{ label:'Deletions %', data:[36.0,27.1,19.6,15.5,1.7], backgroundColor: cs.getPropertyValue('--accent') },{ label:'Population %', data:[36.01,27.12,19.65,15.52,1.7], backgroundColor: cs.getPropertyValue('--primary-yellow') }]}, options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true, max:100 } } }});
      },100);
    }

    function renderDeletions(){ const main=document.getElementById('main'); main.innerHTML=`<div class="grid"><div class="card"><div class="card-header"><h3>Deletion Intensity vs Alliance Win Rates</h3>${createExportButtons(DATA.deletionBins,'chart-intensity')}</div><div class="card-body"><div class="viz"><canvas id="chart-intensity"></canvas></div></div></div><div class="card"><div class="card-header"><h3>Booth Count by Deletion Range</h3>${createExportButtons(DATA.deletionBins,'chart-booths')}</div><div class="card-body"><div class="viz"><canvas id="chart-booths"></canvas></div></div></div></div>`;
      setTimeout(()=>{ const cs=getComputedStyle(document.documentElement); const labels=DATA.deletionBins.map(d=>d.range); const ctx1=document.getElementById('chart-intensity').getContext('2d'); charts['intensity']=new Chart(ctx1,{ type:'line', data:{ labels, datasets:[{ label:'INDIA Win %', data: DATA.deletionBins.map(d=>d.indiaRate), borderColor: cs.getPropertyValue('--india-color'), backgroundColor: cs.getPropertyValue('--india-color')+'22', borderWidth:3, tension:0.35 },{ label:'NDA Win %', data: DATA.deletionBins.map(d=>d.ndaRate), borderColor: cs.getPropertyValue('--nda-color'), backgroundColor: cs.getPropertyValue('--nda-color')+'22', borderWidth:3, tension:0.35 }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'top' } }, scales:{ y:{ beginAtZero:true, max:70 } } }); const ctx2=document.getElementById('chart-booths').getContext('2d'); charts['booths']=new Chart(ctx2,{ type:'bar', data:{ labels, datasets:[{ label:'Booths', data: DATA.deletionBins.map(d=>d.booths), backgroundColor: cs.getPropertyValue('--primary-blue') }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true } } }); },100); }

    function renderGender(){ const main=document.getElementById('main'); main.innerHTML=`<div class="grid"><div class="card"><div class="card-header"><h3>Gender Share of Deletions</h3>${createExportButtons([], 'chart-gender-share')}</div><div class="card-body"><div class="viz"><canvas id="chart-gender-share"></canvas></div></div></div><div class="card"><div class="card-header"><h3>Expected vs Actual Female Deletions</h3>${createExportButtons([], 'chart-gender-expected')}</div><div class="card-body"><div class="viz"><canvas id="chart-gender-expected"></canvas></div></div></div></div>`;
      setTimeout(()=>{ const cs=getComputedStyle(document.documentElement); const ctx1=document.getElementById('chart-gender-share').getContext('2d'); charts['genderShare']=new Chart(ctx1,{ type:'doughnut', data:{ labels:['Female','Male'], datasets:[{ data:[4697088,1862538], backgroundColor:[ cs.getPropertyValue('--danger'), cs.getPropertyValue('--success') ]}]}, options:{ responsive:true, maintainAspectRatio:false } }); const ctx2=document.getElementById('chart-gender-expected').getContext('2d'); charts['genderExpected']=new Chart(ctx2,{ type:'bar', data:{ labels:['Expected Female','Actual Female'], datasets:[{ data:[3213216,4697088], backgroundColor:[ cs.getPropertyValue('--primary-yellow'), cs.getPropertyValue('--danger') ]}]}, options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true } } }); },100); }

    function renderCaste(){ const main=document.getElementById('main'); main.innerHTML=`<div class="grid"><div class="card"><div class="card-header"><h3>Deletions by Caste Category</h3>${createExportButtons(DATA.casteAnalysis,'chart-caste-cat')}</div><div class="card-body"><div class="viz"><canvas id="chart-caste-cat"></canvas></div></div></div><div class="card"><div class="card-header"><h3>Top/Bottom Deleted Surnames</h3></div><div class="card-body"><div class="table-wrapper"><table><thead><tr><th>Rank</th><th>Surname</th><th>Caste</th><th>Deletions</th></tr></thead><tbody>${DATA.topDeletedCastes.map((r,i)=>`<tr><td>${r.rank}</td><td>${r.surname}</td><td>${r.caste}</td><td>${r.count.toLocaleString()}</td></tr>`).join('')}${DATA.leastDeletedCastes.map(r=>`<tr><td>${r.rank}</td><td>${r.surname}</td><td>${r.caste}</td><td>${r.count.toLocaleString()}</td></tr>`).join('')}</tbody></table></div></div></div></div>`;
      setTimeout(()=>{ const cs=getComputedStyle(document.documentElement); const ctx=document.getElementById('chart-caste-cat').getContext('2d'); charts['casteCat']=new Chart(ctx,{ type:'bar', data:{ labels: DATA.casteAnalysis.map(c=>c.caste), datasets:[{ label:'Deletions', data: DATA.casteAnalysis.map(c=>c.deletions), backgroundColor: cs.getPropertyValue('--accent') }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } } }); },100); }

    function renderReligion(){ const main=document.getElementById('main'); main.innerHTML=`<div class="grid"><div class="card"><div class="card-header"><h3>Religious Composition of Deletions</h3>${createExportButtons([], 'chart-religion')}</div><div class="card-body"><div class="viz"><canvas id="chart-religion"></canvas></div></div></div><div class="card"><div class="card-header"><h3>Booths with High Muslim Deletion Share</h3></div><div class="card-body"><div class="takeaway takeaway-info"><p>No constituency-level bias detected in summary; see detailed CSV tables for drill-down.</p></div></div></div></div>`;
      setTimeout(()=>{ const cs=getComputedStyle(document.documentElement); const ctx=document.getElementById('chart-religion').getContext('2d'); charts['religion']=new Chart(ctx,{ type:'pie', data:{ labels:['Hindu','Muslim','Unknown','Other'], datasets:[{ data:[74.4,15.2,8.9,1.5], backgroundColor:[ cs.getPropertyValue('--primary-yellow'), cs.getPropertyValue('--accent'), cs.getPropertyValue('--primary-blue'), cs.getPropertyValue('--success') ]}]}, options:{ responsive:true, maintainAspectRatio:false } }); },100); }

    function renderGeographic(){ const main=document.getElementById('main'); const rows=Object.entries(DATA.geographicPatterns).map(([k,v])=>`<tr><td>${k}</td><td>${v.avgDeletions}</td><td>${v.constituencies}</td><td>${v.pattern}</td></tr>`).join(''); main.innerHTML=`<div class="card"><div class="card-header"><h3>Geographic Patterns by Region Type</h3></div><div class="card-body"><div class="table-wrapper"><table><thead><tr><th>Region Type</th><th>Avg Deletions/Booth</th><th>Constituencies</th><th>Pattern</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`; }

    function renderElectoral(){ const main=document.getElementById('main'); main.innerHTML=`<div class="grid"><div class="card"><div class="card-header"><h3>2020 vs 2024 Votes</h3>${createExportButtons([], 'chart-votes')}</div><div class="card-body"><div class="viz"><canvas id="chart-votes"></canvas></div></div></div><div class="card"><div class="card-header"><h3>2020 vs 2024 Seats</h3>${createExportButtons([], 'chart-seats')}</div><div class="card-body"><div class="viz"><canvas id="chart-seats"></canvas></div></div></div></div>`; setTimeout(()=>{ const cs=getComputedStyle(document.documentElement); const c1=document.getElementById('chart-votes').getContext('2d'); charts['votes']=new Chart(c1,{ type:'bar', data:{ labels:['INDIA','NDA'], datasets:[{ label:'2020', data:[DATA.electionComparison.ls2020.indiaVotes, DATA.electionComparison.ls2020.ndaVotes], backgroundColor: cs.getPropertyValue('--primary-blue') },{ label:'2024', data:[DATA.electionComparison.ls2024.indiaVotes, DATA.electionComparison.ls2024.ndaVotes], backgroundColor: cs.getPropertyValue('--warning') }]}, options:{ responsive:true, maintainAspectRatio:false } }); const c2=document.getElementById('chart-seats').getContext('2d'); charts['seats']=new Chart(c2,{ type:'bar', data:{ labels:['INDIA','NDA'], datasets:[{ label:'2020', data:[DATA.electionComparison.ls2020.indiaSeats, DATA.electionComparison.ls2020.ndaSeats], backgroundColor: cs.getPropertyValue('--primary-blue') },{ label:'2024', data:[DATA.electionComparison.ls2024.indiaSeats, DATA.electionComparison.ls2024.ndaSeats], backgroundColor: cs.getPropertyValue('--warning') }]}, options:{ responsive:true, maintainAspectRatio:false } }); },100); }

    function renderIntegrity(){ const main=document.getElementById('main'); main.innerHTML=`<div class="grid"><div class="card"><div class="card-header"><h3>Integrity Indicators</h3></div><div class="card-body"><ul style="margin-left:1.25rem; line-height:1.9;"><li>High female over-representation among deletions (71.6%)</li><li>Deletion intensity positively associated with NDA wins</li><li>Border and flood-prone regions show higher average deletions</li></ul></div></div><div class="card"><div class="card-header"><h3>Technical Notes</h3></div><div class="card-body"><div class="tech-explain"><h4>On Surname-based Caste Inference</h4><p>Protective surnames like DEVI/KUMARI/KUMAR are widespread and caste-neutral—this reduces classification bias. Only clearly caste-coded surnames were mapped.</p></div></div></div></div>`; }

    function renderMethods(){ const main=document.getElementById('main'); main.innerHTML=`<div class="card"><div class="card-header"><h3>Methodological Framework</h3></div><div class="card-body"><p>We use booth-level deletion counts, alliance win rates, and benchmark demographics (Bihar Caste Survey 2022; NFHS-5). Visualizations use Chart.js; data cleaning and joins performed offline; this dashboard summarizes key patterns.</p></div></div>`; }

    function attachEvents(){ const tabs=document.querySelectorAll('.tab'); tabs.forEach(btn=>btn.addEventListener('click',()=>{ tabs.forEach(b=>b.classList.remove('active')); btn.classList.add('active'); const t=btn.getAttribute('data-tab'); clearCharts(); switch(t){ case 'overview': renderOverview(); break; case 'deletions': renderDeletions(); break; case 'demographic': renderDemographic(); break; case 'gender': renderGender(); break; case 'caste': renderCaste(); break; case 'religion': renderReligion(); break; case 'electoral': renderElectoral(); break; case 'geographic': renderGeographic(); break; case 'integrity': renderIntegrity(); break; case 'methods': renderMethods(); break; default: renderOverview(); } })); document.getElementById('themeToggle').addEventListener('click',()=>{ const html=document.documentElement; html.setAttribute('data-theme', html.getAttribute('data-theme')==='dark'?'light':'dark'); localStorage.setItem('theme', html.getAttribute('data-theme')); }); document.getElementById('lockBtn').addEventListener('click',()=>{ if(confirm('Lock this dashboard?')){ window.__forindiaLogout && window.__forindiaLogout(); } }); const savedTheme=localStorage.getItem('theme'); if(savedTheme){ document.documentElement.setAttribute('data-theme', savedTheme); } }

    // Initial render
    setTimeout(() => {
      renderOverview();
    }, 500);
  
</script>
