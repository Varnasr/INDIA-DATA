name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


# A newer commit on a pull request cancels the run still going for the older one.
# Runs on the default branch are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The Bihar figures are rebuilt from the booth files by build_bihar.py.
      # Pinned in requirements.txt, because a pandas that reads a sheet
      # differently would move the numbers without an error.
      - name: Install the build's two dependencies
        run: pip install -r requirements.txt

      # The earlier dashboard counted every booth six times and carried
      # mislabelled 2024 parties. These checks pin the corrections, and the
      # first rebuilds everything and fails if the published JSON has drifted.
      - name: Data integrity
        run: python3 scripts/check_data.py

      # An independent recomputation of every headline figure from the raw
      # files, with code that does not share the build's.
      - name: Recompute the Bihar figures from the raw files
        run: python3 scripts/verify_bihar.py

      # Every page is built from site/places.json and site/pages by
      # scripts/build_site.py. A page edited directly, or a source changed
      # without rebuilding, fails here.
      - name: Pages match their sources
        run: python3 scripts/build_site.py --check

      # Netlify publishes only _site, an allowlist. A new top-level folder
      # fails here until it is named published or kept back.
      - name: Every top-level entry is published or kept back
        run: python3 scripts/stage_site.py

      # One palette for every page, in assets/sir.css, measured in both themes.
      - name: Colour tokens clear AA in both themes
        run: python3 scripts/check_contrast.py

      # Hindi, Urdu, Telugu, Tamil and Bengali: every string on every page has a translation,
      # and no translation drops a figure, a placeholder or a link.
      - name: Every string is translated, placeholders and links intact
        run: python3 scripts/check_i18n.py

      # No dash, banned word or "X, not Y" turn in the site's own words.
      - name: Writing rules
        run: python3 scripts/check_writing.py

      - name: Every CSV parses and is rectangular
        run: |
          python3 - <<'PY'
          import csv, glob, sys
          bad = []
          for f in sorted(glob.glob("data/**/*.csv", recursive=True)):
              with open(f, newline="", encoding="utf-8") as fh:
                  rows = list(csv.reader(fh))
              if not rows:
                  bad.append(f"{f}: empty"); continue
              widths = {len(r) for r in rows if r}
              if len(widths) != 1:
                  bad.append(f"{f}: ragged rows, widths {sorted(widths)}")
              else:
                  print(f"  ok  {f}  {len(rows)-1} rows x {widths.pop()} cols")
          if bad:
              sys.exit("FAIL\n  " + "\n  ".join(bad))
          print("PASS")
          PY
