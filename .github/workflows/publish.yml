name: Publish offtheroll.in

# Fallback for the daily publish. The publish for every locked site runs from
# the private Democracy-by-Design repository at 20:00 IST, and GitHub refuses
# to start a private repository's runs when the account's billing fails. This
# repository is public, so this runs free. It publishes only a build newer than
# the live one, so it does nothing on a day the main publish went through.
# Scheduled runs often start late. Run it by hand to publish at once.
on:
  schedule:
    - cron: '47 15 * * *'   # 21:17 IST
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Forks get the schedule too; only this repository holds the token.
    if: github.repository == 'Varnasr/INDIA-DATA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish the newest build if it is not live
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: python3 scripts/publish_live.py
