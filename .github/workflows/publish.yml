name: Publish offtheroll.in

# Fallback for the daily publish. The publish for every locked site runs from
# the Democracy-by-Design repository at 20:00 IST, and GitHub starts scheduled
# runs late or, as on 21 October 2026, not at all. This publishes only a build
# newer than the live one, so it does nothing on a day the main publish went
# through. It can start late too. Run it by hand to publish at once.
on:
  schedule:
    - cron: '47 15 * * *'   # 21:17 IST
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # Forks get the schedule too; only this repository holds the token.
    if: github.repository == 'Varnasr/INDIA-DATA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish the newest build if it is not live
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: python3 scripts/publish_live.py
