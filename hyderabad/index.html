<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>
(function () {
  var X = DASH, n = X.n, d = X.d, pct = X.pct, lakh = X.lakh, esc = X.esc, sum = X.sum, median = X.median, rho = X.rho;
  var C = X.C, kpis = X.kpis, banner = X.banner, card = X.card, section = X.section, grid = X.grid, barOpts = X.barOpts, hbar = X.hbar, chart = X.chart;
  var main = document.getElementById('content');
  var ACC = ['#8B1E3F', '#0E5E6F', '#E0A526', '#1F618D', '#8E7CC3'];

  Promise.all([SIR.json('data/hyderabad/summary.json'), SIR.json('data/hyderabad/parts.json')]).then(function (r) {
    var S = r[0], A = S.acs, t = S.totals, names = A.map(function (a) { return a.name; });
    var F = r[1].fields, PR = r[1].rows.map(function (row) { var o = {}; F.forEach(function (f, i) { o[f] = row[i]; }); if (o.locality === 'nan') o.locality = null; return o; });
    var byName = {}; A.forEach(function (a) { byName[a.name] = a; });
    var s = function (f) { return sum(A, f); };
    var L = A.filter(function (a) { return a.linked; });
    var ageAll = S.bands.map(function (b, i) { return 100 * s(function (a) { return a.counts.age_asd[i]; }) / s(function (a) { return a.age_all[i]; }); });
    var reasonTot = S.reasons.map(function (k) { return s(function (a) { return a.reasons[k]; }); });
    var rsh = function (k) { return 100 * s(function (a) { return a.reasons[k]; }) / t.deleted; };
    var untrAC = A.map(function (a) { return 100 * a.reasons['Untraceable/Absent'] / a.deleted; });
    var overM = A.filter(function (a) { return a.deleted > a.e2023.margin; }), overV = A.filter(function (a) { return a.e2023.deleted_over_valid > 100; });
    var yak = byName.Yakutpura;
    var hin = 100 * s(function (a) { return a.counts.hin_asd; }) / s(function (a) { return a.counts.hin_all; });
    var mus = 100 * s(function (a) { return a.counts.mus_asd; }) / s(function (a) { return a.counts.mus_all; });
    var HM = A.map(function (a) { return a.within_part.hindu_minus_muslim; });
    var hmParts = sum(HM, 'parts'), hmA = sum(HM, 'a_higher');
    var UL = L.map(function (a) { return a.within_part.unlinked_minus_linked; });
    var ulParts = sum(UL, 'parts'), ulA = sum(UL, 'a_higher');
    var lkRate = 100 * sum(L, function (a) { return a.counts.lk_asd; }) / sum(L, function (a) { return a.counts.lk_all; });
    var ulRate = 100 * sum(L, function (a) { return a.deleted - a.counts.lk_asd; }) / sum(L, function (a) { return a.electors - a.counts.lk_all; });
    var fRate = 100 * s(function (a) { return a.counts.f_asd; }) / s(function (a) { return a.counts.f_all; });
    var mRate = 100 * s(function (a) { return a.counts.m_asd; }) / s(function (a) { return a.counts.m_all; });
    var FM = A.map(function (a) { return a.within_part.female_minus_male.diff_pp; });
    var slots = s('slots'), heavy = A.slice().sort(function (a, b) { return b.max_slot - a.max_slot; })[0];
    var ruleTot = S.rules.map(function (k) { return s(function (a) { return a.rules[k] || 0; }); });
    var P100 = PR.filter(function (p) { return p.electors >= 100; });
    var over60 = P100.filter(function (p) { return p.rate > 60; });
    var minMax = function (arr) { return [Math.min.apply(null, arr), Math.max.apply(null, arr)]; };
    var rateRange = minMax(P100.map(function (p) { return p.rate; }));
    var mc = A.map(function (a) { return a.part_correlations.muslim_share_vs_rate; });
    var sortedRate = A.slice().sort(function (a, b) { return b.rate - a.rate; });
    var html = '';

    // ============================================================ OVERVIEW
    chart('ov1', { type: 'bar', data: { labels: names, datasets: [
      { label: 'Struck off', data: A.map(function (a) { return a.rate; }), backgroundColor: C.red },
      { label: 'Kept, summoned to a hearing', data: A.map(function (a) { return a.hearing_rate; }), backgroundColor: C.yellow },
      { label: 'Kept, untouched', data: A.map(function (a) { return 100 - a.rate - a.hearing_rate - 100 * a.unaccounted / a.electors; }), backgroundColor: C.dblue }] },
      options: { indexAxis: 'y', plugins: { legend: { position: 'bottom' } }, scales: { x: { stacked: true, max: 100, title: { display: true, text: '% of the pre-revision roll' } }, y: { stacked: true } } } });
    var ov2 = hbar(names, A.map(function (a) { return a.e2023.deleted_over_margin; }), ACC, 'Names struck off ÷ 2023 winning margin (log scale)');
    ov2.options.scales.x = { type: 'logarithmic', min: 1, title: ov2.options.scales.x.title };
    chart('ov2', ov2);
    chart('ov3', { type: 'bar', data: { labels: S.bands, datasets: [{ label: 'Struck off', data: ageAll.map(function (v) { return +v.toFixed(1); }), backgroundColor: C.maroon }] }, options: barOpts('Age band', '% of the band struck off') });
    chart('ov4', { type: 'bar', data: { labels: L.map(function (a) { return a.name; }), datasets: [{ label: 'Linked to the 2002 roll', data: L.map(function (a) { return a.linked_rate; }), backgroundColor: C.ikat }, { label: 'No link to the 2002 roll', data: L.map(function (a) { return a.unlinked_rate; }), backgroundColor: C.red }] }, options: barOpts('', '% struck off', { plugins: { legend: { position: 'bottom' } } }) });
    chart('ov5', { type: 'doughnut', data: { labels: S.reasons, datasets: [{ data: reasonTot, backgroundColor: [C.dblue, C.red, C.grey, C.gold] }] }, options: { plugins: { legend: { position: 'bottom' } } } });
    chart('ov6', { type: 'bar', data: { labels: names, datasets: [{ label: 'Median cases per slot', data: A.map(function (a) { return a.median_slot; }), backgroundColor: C.ikat }, { label: 'Heaviest single slot', data: A.map(function (a) { return a.max_slot; }), backgroundColor: C.maroon }] }, options: barOpts('', 'Cases listed for one hearing slot', { plugins: { legend: { position: 'bottom' } } }) });
    html += section('overview',
      kpis([[n(t.electors), 'Electors on the pre-revision rolls'], [n(t.deleted), 'Struck off'], [pct(t.rate), 'Of the rolls struck off'], [n(t.hearing), 'Kept, summoned to a hearing'], [overM.length + ' of ' + A.length, 'Seats where names struck off exceed the 2023 margin'], [n(t.parts), 'Polling parts']]) +
      banner('Key finding', 'The revision struck ' + lakh(t.deleted) + ' names off the rolls of five Old City constituencies, ' + pct(t.rate) + ' of all electors, and summoned ' + lakh(t.hearing) + ' more to hearings. Every constituency lost more names than its 2023 winning margin; Yakutpura, won by ' + n(yak.e2023.margin) + ' votes, lost ' + n(yak.deleted) + '.') +
      '<div class="hubs"><a class="hub" href="explorer/"><b>Part explorer</b><span>Any constituency and any of its ' + n(t.parts) + ' polling parts, with every fate, reason and rule.</span></a><a class="hub" href="faq/"><b>Questions and answers</b><span>The criticisms put to this analysis, answered from the lists.</span></a><a class="hub" href="../"><b>Bihar 2025</b><span>69 lakh names removed across 243 constituencies, booth by booth.</span></a></div>' +
      grid(
        card(1, 'ov1', 'What happened to each elector?', 'Of ' + n(t.electors) + ' electors, ' + pct(t.rate) + ' were struck off and ' + pct(100 * t.hearing / t.electors) + ' kept but summoned to a hearing. ' + sortedRate[0].name + ' lost the most (' + pct(sortedRate[0].rate) + '), ' + sortedRate[4].name + ' the least (' + pct(sortedRate[4].rate) + ').') +
        card(2, 'ov2', 'Did removals exceed the winning margins?', 'In all ' + A.length + ' constituencies. Yakutpura lost ' + d(yak.e2023.deleted_over_margin, 1) + ' times its 2023 margin; in ' + overV.map(function (a) { return a.name; }).join(' and ') + ' the names struck off outnumber every valid vote cast in 2023.') +
        card(3, 'ov3', 'Who was struck off, by age?', pct(ageAll[7]) + ' of electors aged 80 and over were struck off, against ' + pct(ageAll[0]) + ' of those aged 18 to 24.') +
        card(4, 'ov4', 'How much did the 2002 link matter?', 'Electors with no link to the 2002 roll were struck off ' + d(Math.min.apply(null, UL.map(function (u) { return u.diff_pp; })), 0) + ' to ' + d(Math.max.apply(null, UL.map(function (u) { return u.diff_pp; })), 0) + ' points more often than linked electors in the same polling part.') +
        card(5, 'ov5', 'What reasons did officers record?', pct(rsh('Permanently Shifted')) + ' "permanently shifted", ' + pct(rsh('Untraceable/Absent')) + ' "untraceable or absent", ' + pct(rsh('Death')) + ' dead, ' + pct(rsh('Already enrolled')) + ' enrolled elsewhere. Each is an officer\'s entry, not a finding.') +
        card(6, 'ov6', 'Could the hearings be held properly?', 'The heaviest single slot listed ' + n(heavy.max_slot) + ' cases, in ' + heavy.name + '. A slot of that size leaves each elector a minute or two.')
      ) +
      '<div class="card wide"><div class="card-title"><span>The five constituencies</span></div><div class="twrap" tabindex="0" role="region" aria-label="The five constituencies"><table><thead><tr><th scope="col" class="l">Constituency</th><th scope="col">Electors</th><th scope="col">Struck off</th><th scope="col">% struck off</th><th scope="col">% summoned</th><th scope="col" class="l">2023 winner</th><th scope="col">2023 margin</th><th scope="col">Struck off ÷ margin</th><th scope="col">Struck off ÷ valid votes</th></tr></thead><tbody>' +
      A.map(function (a) { return '<tr><td class="l"><a href="explorer/#' + a.name + '">' + a.name + '</a></td><td>' + n(a.electors) + '</td><td>' + n(a.deleted) + '</td><td>' + d(a.rate, 1) + '</td><td>' + d(a.hearing_rate, 1) + '</td><td class="l">' + esc(a.e2023.winner) + '</td><td>' + n(a.e2023.margin) + '</td><td>' + d(a.e2023.deleted_over_margin, 1) + '×</td><td>' + d(a.e2023.deleted_over_valid, 1) + '%</td></tr>'; }).join('') +
      '</tbody></table></div><div class="chart-takeaway">' + X.ICON + ' Each constituency name opens it in the part explorer.</div></div>');

    // ============================================================ DELETIONS
    var tops = A.map(function (a) { return a.name; });
    chart('de1', { type: 'bar', data: { labels: names, datasets: S.reasons.map(function (k, i) { return { label: k, data: A.map(function (a) { return +(100 * a.reasons[k] / a.deleted).toFixed(1); }), backgroundColor: [C.dblue, C.red, C.grey, C.gold][i] }; }) }, options: { indexAxis: 'y', plugins: { legend: { position: 'bottom' } }, scales: { x: { stacked: true, max: 100, title: { display: true, text: '% of names struck off' } }, y: { stacked: true } } } });
    chart('de2', { type: 'bar', data: { labels: names, datasets: [{ label: 'Struck off', data: A.map(function (a) { return a.deleted; }), backgroundColor: ACC }] }, options: barOpts('', 'Names struck off') });
    chart('de3', hbar(names, untrAC.map(function (v) { return +v.toFixed(1); }), C.red, '"Untraceable or absent", % of names struck off'));
    chart('de4', { type: 'bar', data: { labels: names, datasets: [{ label: 'Deaths recorded', data: A.map(function (a) { return a.reasons.Death; }), backgroundColor: C.grey }, { label: 'Struck off aged 70 and over', data: A.map(function (a) { return a.counts.age_asd[6] + a.counts.age_asd[7]; }), backgroundColor: C.maroon }] }, options: barOpts('', 'Electors', { plugins: { legend: { position: 'bottom' } } }) });
    chart('de5', { type: 'bar', data: { labels: names, datasets: [{ label: 'In none of the three fates', data: A.map(function (a) { return a.unaccounted; }), backgroundColor: C.grey }] }, options: barOpts('', 'Electors') });
    chart('de6', hbar(names, A.map(function (a) { return +(100 * a.reasons['Already enrolled'] / a.deleted).toFixed(1); }), C.gold, '"Already enrolled", % of names struck off'));
    var deaths = s(function (a) { return a.reasons.Death; }), old70 = s(function (a) { return a.counts.age_asd[6] + a.counts.age_asd[7]; });
    var unA = minMax(untrAC);
    html += section('deletions',
      kpis([[pct(rsh('Permanently Shifted')), '"Permanently shifted"'], [pct(rsh('Untraceable/Absent')), '"Untraceable or absent"'], [pct(rsh('Death')), 'Dead'], [pct(rsh('Already enrolled')), 'Enrolled elsewhere']]) +
      banner('Reasons recorded', 'The Commission\'s list of the absent, shifted and dead carries a reason against each name. Most say the elector moved. The untraceable share runs from ' + pct(unA[0]) + ' to ' + pct(unA[1]) + ' between constituencies. Those entries rest on an officer not finding someone, and they are where verification should begin.') +
      grid(
        card(1, 'de1', 'Which reasons, in which constituency?', 'Untraceable or absent is ' + A.map(function (a, i) { return pct(untrAC[i]) + ' in ' + a.name; }).join(', ') + '.') +
        card(2, 'de2', 'How many names did each lose?', A.slice().sort(function (a, b) { return b.deleted - a.deleted; }).map(function (a) { return a.name + ' ' + n(a.deleted); }).join(', ') + '.') +
        card(3, 'de3', 'Where is "untraceable" most common?', A[untrAC.indexOf(unA[1])].name + ' records ' + pct(unA[1]) + ' of its removals as untraceable or absent; ' + A[untrAC.indexOf(unA[0])].name + ' ' + pct(unA[0]) + '.') +
        card(4, 'de4', 'Does death explain the old?', n(deaths) + ' deaths were recorded, against ' + n(old70) + ' electors aged 70 and over struck off. Death is part of the top of the age range, not all of it.') +
        card(5, 'de5', 'Are the lists complete?', 'Electors in none of the three fates: ' + A.map(function (a) { return a.name + ' ' + n(a.unaccounted); }).join(', ') + '. Malakpet\'s list is incomplete and is read by polling-station name.') +
        card(6, 'de6', 'How many were enrolled twice?', 'Enrolled elsewhere is ' + pct(rsh('Already enrolled')) + ' of all removals, the smallest of the four reasons.')
      ));

    // ============================================================ AGE AND SEX
    chart('ag1', { type: 'line', data: { labels: S.bands, datasets: A.map(function (a, i) { return { label: a.name, data: a.age_rate, borderColor: ACC[i], backgroundColor: ACC[i], tension: 0.3, pointRadius: 3 }; }) }, options: barOpts('Age band', '% struck off', { plugins: { legend: { position: 'bottom' } } }) });
    chart('ag2', { type: 'bar', data: { labels: S.bands, datasets: [{ label: 'Share of all names struck off', data: S.bands.map(function (b, i) { return +(100 * s(function (a) { return a.counts.age_asd[i]; }) / t.deleted).toFixed(1); }), backgroundColor: C.ikat }] }, options: barOpts('Age band', '% of names struck off') });
    chart('ag3', { type: 'bar', data: { labels: names, datasets: [{ label: 'Women', data: A.map(function (a) { return a.female_rate; }), backgroundColor: C.pink }, { label: 'Men', data: A.map(function (a) { return a.male_rate; }), backgroundColor: C.dblue }] }, options: barOpts('', '% struck off', { plugins: { legend: { position: 'bottom' } } }) });
    chart('ag4', hbar(names, FM, FM.map(function (v) { return v > 0 ? C.pink : C.dblue; }), 'Women\'s rate minus men\'s, inside each part (points)'));
    chart('ag5', { type: 'bar', data: { labels: names, datasets: [{ label: 'Women, % of the roll', data: A.map(function (a) { return a.female_share_roll; }), backgroundColor: C.grey }, { label: 'Women, % of those struck off', data: A.map(function (a) { return a.female_share_deleted; }), backgroundColor: C.pink }] }, options: barOpts('', '%', { plugins: { legend: { position: 'bottom' } }, scales: { y: { min: 40, max: 55, title: { display: true, text: '%' } } } }) });
    chart('ag6', hbar(names, A.map(function (a) { return a.age_rate[7]; }), C.maroon, '% of electors aged 80+ struck off'));
    var a80 = minMax(A.map(function (a) { return a.age_rate[7]; })), a18 = minMax(A.map(function (a) { return a.age_rate[0]; }));
    html += section('age',
      kpis([[pct(ageAll[7]), 'Aged 80+ struck off'], [pct(ageAll[0]), 'Aged 18 to 24 struck off'], [pct(fRate), 'Women struck off'], [pct(mRate), 'Men struck off']]) +
      banner('Age and sex', 'The older the elector, the likelier the removal, in every constituency: between ' + pct(a80[0]) + ' and ' + pct(a80[1]) + ' of electors aged 80 and over were struck off, against ' + pct(a18[0]) + ' to ' + pct(a18[1]) + ' of those aged 18 to 24. Women and men were struck off at similar rates.') +
      grid(
        card(1, 'ag1', 'How does removal rise with age?', 'The rate roughly doubles between 18 to 24 and 30 to 39, ages at which almost nobody dies, so death is not the whole of it.') +

        list.map(function (p) { return '<tr><td class="l">' + p.ac + '</td><td><a href="explorer/#' + p.ac + '-' + p.part + '">' + p.part + '</a></td><td class="l">' + esc(p.locality || '–') + '</td><td>' + n(p.electors) + '</td><td>' + n(p.deleted) + '</td><td>' + d(p.rate, 1) + '</td><td>' + d(p.hearing_rate, 1) + '</td><td>' + d(p.muslim_share_roll, 0) + '</td><td>' + d(p.untraceable_share_of_deleted, 0) + '</td></tr>'; }).join('') + '</tbody>';
    }
    document.getElementById('partTable').addEventListener('click', function (e) { var b = e.target.closest('th button'); if (!b) return; var k = b.getAttribute('data-k'); dir = k === key ? -dir : -1; key = k; renderTable(); });
    document.getElementById('partq').addEventListener('input', function () { q = this.value.trim().toLowerCase(); renderTable(); });
    renderTable();

    DASH.start(main, 'hyderabad-sir');
  }).catch(function (e) { main.innerHTML = '<p role="alert">The dashboard data did not load (' + esc(e.message) + '). Please reload the page.</p>'; });
})();
